<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ps-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16335a;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#1f4a82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a6498;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ps-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6B545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E08A12;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ps-pupil" cx="40%" cy="34%" r="75%">
      <stop offset="0%" style="stop-color:#21406b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e2238;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- rounded square base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#ps-base)"/>

  <!-- corner viewfinder brackets (scan frame) -->
  <g fill="none" stroke="url(#ps-amber)" stroke-width="14" stroke-linecap="round">
    <path d="M70 132 V86 a18 18 0 0 1 18 -18 H134"/>
    <path d="M442 132 V86 a18 18 0 0 0 -18 -18 H378"/>
    <path d="M70 380 V424 a18 18 0 0 0 18 18 H134"/>
    <path d="M442 380 V424 a18 18 0 0 1 -18 18 H378"/>
  </g>

  <!-- eye outline: wider, rounder (less elongated) -->
  <path d="M104 256 Q256 190 408 256 Q256 322 104 256 Z" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.92"/>

  <!-- code nodes around pupil -->
  <g stroke="url(#ps-amber)" stroke-width="6" opacity="0.9">
    <line x1="256" y1="256" x2="172" y2="196"/>
    <line x1="256" y1="256" x2="340" y2="196"/>
    <line x1="256" y1="256" x2="172" y2="316"/>
    <line x1="256" y1="256" x2="340" y2="316"/>
  </g>
  <g fill="url(#ps-amber)">
    <circle cx="172" cy="196" r="11"/>
    <circle cx="340" cy="196" r="11"/>
    <circle cx="172" cy="316" r="11"/>
    <circle cx="340" cy="316" r="11"/>
  </g>

  <!-- pupil: larger, fuller -->
  <circle cx="256" cy="256" r="74" fill="url(#ps-pupil)"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="url(#ps-amber)" stroke-width="7"/>
  <circle cx="232" cy="232" r="13" fill="#ffffff" opacity="0.9"/>

  <!-- code glyph in pupil -->
  <text x="256" y="280" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="700" font-size="58" fill="#F6B545">&lt;/&gt;</text>
</svg>
