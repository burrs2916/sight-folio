<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语料库 · 现代工作台</title>
    <style>
      :root {
        /* 语义令牌 —— 现代工作台 · 浅色高对比底 + 靛蓝主色 */
        --bg: #f4f6fa;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-soft: #eef2ff;
        --text: #0f172a;
        --text-2: #475569;
        --text-3: #64748b;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --success: #16a34a;
        --radius-lg: 14px;
        --radius-md: 10px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.05);
        --font:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          'Helvetica Neue', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input,
      select {
        font-family: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ===== 布局 ===== */
      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ===== 顶栏 ===== */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 28px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
      }
      .brand-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .brand-sub {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 1px;
      }

      /* 工具条：搜索 + 选择器合并 */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 420px;
        min-width: 320px;
      }
      .search {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 8px 12px;
        color: var(--text-3);
        transition:
          border-color 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }
      .search:focus-within {
        border-color: var(--primary);
        background: var(--surface);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
      }
      .search input {
        flex: 1;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13.5px;
        color: var(--text);
        min-width: 0;
      }
      .search input::placeholder {
        color: var(--text-3);
      }
      .corpus-select {
        position: relative;
        flex-shrink: 0;
      }
      .corpus-select select {
        appearance: none;
        -webkit-appearance: none;
        max-width: 300px;
        padding: 9px 34px 9px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .corpus-select svg {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--text-3);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 600;
        padding: 9px 14px;
        border: 1px solid transparent;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s,
          box-shadow 0.15s;
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn-ghost {
        background: var(--surface);
        border-color: var(--border);
        color: var(--text-2);
      }
      .btn-ghost:hover {
        background: var(--surface-2);
        border-color: var(--border-strong);
        color: var(--text);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 1px 3px rgba(79, 70, 229, 0.35);
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }

      /* ===== 主体 ===== */
      .body {
        display: flex;
        flex: 1;
        align-items: stretch;
        max-width: 1440px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 28px 48px;
        gap: 24px;
      }

      /* 左侧分类树 */
      .sidebar {
        width: 252px;
        flex-shrink: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 14px;
        height: fit-content;
        position: sticky;
        top: 92px;
      }
      .side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 4px 10px;
      }
      .side-head .side-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-2);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .side-head .count-badge {
        font-size: 12px;
        color: var(--text-3);
        font-weight: 500;
      }
      .collapse-all {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--primary);
        font-weight: 600;
        background: none;
        border: none;
        padding: 3px 6px;
        border-radius: 6px;
      }
      .collapse-all:hover {
        background: var(--primary-soft);
      }
      .tree {
        list-style: none;
      }
      .tree-node {
        margin-bottom: 2px;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        text-align: left;
        background: none;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-2);
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .tree-row:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .tree-row.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }
      .tree-row .num {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-3);
        font-weight: 500;
      }
      .tree-row.active .num {
        color: var(--primary);
      }
      .tree-row .chev {
        transition: transform 0.18s;
        color: var(--text-3);
      }
      .tree-node.open > .tree-row .chev {
        transform: rotate(180deg);
      }
      .tree-children {
        list-style: none;
        padding-left: 14px;
        display: none;
      }
      .tree-node.open > .tree-children {
        display: block;
      }
      .tree-child {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
      }
      .tree-child .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border-strong);
        flex-shrink: 0;
      }
      .tree-child .name {
        color: var(--text-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-child .tag {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-3);
        flex-shrink: 0;
      }

      /* 右侧主区 */
      .main {
        flex: 1;
        min-width: 0;
      }
      .stat-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding: 2px 2px 16px;
      }
      .stat-bar .stat {
        font-size: 13px;
        color: var(--text-2);
      }
      .stat-bar .stat strong {
        color: var(--text);
        font-weight: 600;
      }

      /* 作品卡片 —— 列表行 */
      .work-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .work-card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 16px 18px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .work-card:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow-md);
      }
      .work-cover {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #eef2ff, #e0e7ff);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .work-info {
        flex: 1;
        min-width: 0;
      }
      .work-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .work-title {
        font-size: 14.5px;
        font-weight: 650;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
        color: var(--primary);
        background: var(--primary-soft);
        border: 1px solid #dbe2ff;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.12s;
      }
      .chip:hover {
        background: #e0e7ff;
      }
      .work-meta {
        margin-top: 4px;
        font-size: 12.5px;
        color: var(--text-3);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .work-meta .sep {
        color: var(--border-strong);
      }
      .work-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        color: var(--text-3);
        background: none;
        border: 1px solid transparent;
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s;
      }
      .icon-btn:hover {
        background: var(--surface-2);
        color: var(--text);
        border-color: var(--border);
      }
      .icon-btn.danger:hover {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: #fecaca;
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 删除确认（页内 inline 卡片，替代原生 confirm） */
      .confirm-card {
        border: 1px solid #fecaca;
        background: var(--danger-soft);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        animation: rise 0.18s ease-out;
      }
      .confirm-card .msg {
        flex: 1;
        min-width: 200px;
        font-size: 13px;
        color: #7f1d1d;
      }
      .confirm-card .row {
        display: flex;
        gap: 8px;
      }
      .btn-small {
        padding: 6px 12px;
        font-size: 12.5px;
        border-radius: 8px;
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: #b91c1c;
      }
      .btn-ghost-danger {
        background: var(--surface);
        border-color: #fecaca;
        color: #b91c1c;
      }
      .btn-ghost-danger:hover {
        background: #fff;
      }

      /* 空状态 */
      .empty {
        background: var(--surface);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 48px 20px;
        text-align: center;
        color: var(--text-3);
      }
      .empty .empty-icon {
        color: var(--border-strong);
        margin-bottom: 10px;
      }
      .empty .empty-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: 4px;
      }
      .empty p {
        font-size: 13px;
      }
      .empty .btn {
        margin-top: 16px;
      }

      /* toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(16px);
        background: var(--text);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        opacity: 0;
        pointer-events: none;
        z-index: 60;
        transition:
          opacity 0.2s,
          transform 0.2s;
        max-width: min(480px, calc(100vw - 40px));
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ===== 响应式 ===== */
      @media (max-width: 920px) {
        .topbar {
          padding: 12px 16px;
          gap: 12px;
        }
        .toolbar {
          flex-basis: 100%;
          order: 3;
          min-width: 0;
        }
        .body {
          flex-direction: column;
          padding: 16px 16px 40px;
          gap: 16px;
        }
        .sidebar {
          width: 100%;
          position: static;
        }
        .tree-children {
          padding-left: 8px;
        }
      }
      @media (max-width: 600px) {
        .top-actions {
          width: 100%;
          margin-left: 0;
        }
        .top-actions .btn {
          flex: 1;
          justify-content: center;
        }
        .corpus-select select {
          max-width: 100%;
        }
        .work-card {
          flex-wrap: wrap;
        }
        .work-actions {
          width: 100%;
          justify-content: flex-end;
          border-top: 1px solid var(--border);
          padding-top: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- 顶栏：品牌 + 合并搜索/筛选 + 操作 -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 11.55c-1.82-1.7-4.12-2.89-6.68-3.35C4.11 7.99 3 8.95 3 10.18v6.24c0 1.68.72 2.56 1.71 2.69 2.5.32 4.77 1.35 6.63 2.87.35.29.92.32 1.27.04 1.87-1.53 4.16-2.58 6.68-2.9.94-.13 1.71-1.06 1.71-2.02v-6.92c0-1.23-1.11-2.19-2.32-1.98-2.56.46-4.86 1.65-6.68 3.35M12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3"
              />
            </svg>
          </span>
          <div>
            <div class="brand-title">语料库</div>
            <div class="brand-sub">导入你欣赏的作品，写作时随时检索它的词汇与表达</div>
          </div>
        </div>

        <div class="toolbar" role="search">
          <label class="search" for="q">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"
              />
            </svg>
            <input
              id="q"
              type="text"
              placeholder="搜索词汇或语句（不少于 3 个字符时按相关性排序）"
              autocomplete="off"
            />
          </label>
          <div class="corpus-select">
            <select id="corpus" aria-label="语料库作品">
              <option>斗破苍穹第1卷至第26卷结局(全集)- [77ebooks.com]</option>
            </select>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </div>
        </div>

        <div class="top-actions">
          <button class="btn btn-ghost" id="btnMaintain" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M3 18c0 .55.45 1 1 1h5v-2H4c-.55 0-1 .45-1 1M3 6c0 .55.45 1 1 1h9V5H4c-.55 0-1 .45-1 1m10 14v-1h7c.55 0 1-.45 1-1s-.45-1-1-1h-7v-1c0-.55-.45-1-1-1s-1 .45-1 1v4c0 .55.45 1 1 1 1-.45 1-1M7 10v1H4c-.55 0-1 .45-1 1s.45 1 1 1h3v1c0 .55.45 1 1 1.45 1 1-1v-4c0-.55-.45-1-1-1s-1 .45-1 1m14 2c0-.55-.45-1-1-1h-9v2h9c.55 0 1-.45 1-1m-5-3c.55 0 1-.45 1-1V7h3c.55 0 1-.45 1-1s-.45-1-1-1h-3V4c0-.55-.45-1-1-1s-1 .45-1 1v4c0 .55.45 1 1 1"
              />
            </svg>
            维护
          </button>
          <button class="btn btn-primary" id="btnImport" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2M12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8m3.5-9H13V7.5c0-.28-.22-.5-.5-.5h-1c-.28 0-.5.22-.5.5V11H8.5c-.28 0-.5.22-.5.5v1c0 .28.22.5.5.5H11v3.5c0 .28.22.5.5.5h1c.28 0 .5-.22.5-.5V13h2.5c.28 0 .5-.22.5-.5v-1c0-.28-.22-.5-.5-.5"
              />
            </svg>
            导入作品
          </button>
        </div>
      </header>

      <!-- 主体 -->
      <div class="body">
        <!-- 左侧分类树 -->
        <aside class="sidebar" aria-label="分类与标签组">
          <div class="side-head">
            <span class="side-title">分类 / 标签组</span>
            <button class="collapse-all" id="btnCollapseAll" type="button" aria-expanded="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 14l5-5 5 5z" />
              </svg>
              <span id="collapseLabel">收起全部</span>
            </button>
          </div>
          <ul class="tree" id="tree">
            <li class="tree-node" data-cat="all">
              <button class="tree-row active" type="button" data-target="all" aria-expanded="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8z" />
                </svg>
                全部作品
                <span class="num" id="numAll">1</span>
              </button>
            </li>
            <li class="tree-node open" data-cat="玄幻">
              <button class="tree-row" type="button" data-target="玄幻" aria-expanded="true">
                <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 2 4 5v6c0 5.05 3.42 9.74 8 10 4.58-.26 8-4.95 8-10V5zm0 2.62 6 2.25V11c0 4.1-2.56 7.8-6 8.63V4.62z"
                  />
                </svg>
                玄幻
                <span class="num" id="numXu">1</span>
              </button>
              <ul class="tree-children">
                <li class="tree-child">
                  <span class="dot" aria-hidden="true"></span>
                  <span class="name">斗破苍穹第1卷至第26卷结局(全集)</span>
                  <span class="tag">1 部作品</span>
                </li>
              </ul>
            </li>
          </ul>
        </aside>

        <!-- 右侧卡片列表 -->
        <main class="main">
          <div class="stat-bar">
            <span class="stat"
              >共 <strong id="statCount">1 部作品</strong> · <strong id="statGroup">1 个分类</strong>/标签组</span
            >
            <span class="stat" id="filterHint" hidden></span>
          </div>

          <div class="work-list" id="workList" aria-live="polite">
            <!-- 作品卡片由 JS 渲染，交互状态存内存 -->
          </div>

          <div class="empty" id="emptyView" hidden>
            <div class="empty-icon">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2m0 14H5.17L4 17.17V4h16z" />
              </svg>
            </div>
            <div class="empty-title">没有匹配的作品</div>
            <p>换个关键词或分类试试，或导入新的作品。</p>
            <button class="btn btn-primary" id="btnEmptyImport" type="button">导入作品</button>
          </div>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script data-design-suite-sandbox-shim>
      /* 会话内存状态（单文件交付：刷新即回到初始值，属预期行为） */
      var store = {
        works: [
          {
            id: 'w1',
            title: '斗破苍穹第1卷至第26卷结局(全集)',
            source: '77ebooks.com',
            category: '玄幻',
            words: '510.9万 字',
            sentences: '10万 句',
          },
        ],
        activeCat: 'all',
        query: '',
        expanded: true,
        pendingDelete: null,
      };

      var els = {
        list: document.getElementById('workList'),
        empty: document.getElementById('emptyView'),
        statCount: document.getElementById('statCount'),
        statGroup: document.getElementById('statGroup'),
        filterHint: document.getElementById('filterHint'),
        toast: document.getElementById('toast'),
        tree: document.getElementById('tree'),
        collapseBtn: document.getElementById('btnCollapseAll'),
        search: document.getElementById('q'),
        corpus: document.getElementById('corpus'),
      };

      var toastTimer = null;
      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          els.toast.classList.remove('show');
        }, 2600);
      }

      function iconSvg(name) {
        var paths = {
          edit: '<path d="M3 17.46v3.04c0 .28.22.5.5.5h3.04c.13 0 .26-.05.35-.15L17.81 9.94l-3.75-3.75L3.15 17.1q-.15.15-.15.36M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>',
          refresh:
            '<path d="M17.65 6.35c-1.63-1.63-3.94-2.57-6.48-2.31-3.67.37-6.69 3.35-7.1 7.02C3.52 15.91 7.27 20 12 20c3.19 0 5.93-1.87 7.21-4.56.32-.67-.16-1.44-.9-1.44-.37 0-.72.2-.88.53-1.13 2.43-3.84 3.97-6.8 3.31-2.22-.49-4.01-2.3-4.48-4.52C5.31 9.44 8.26 6 12 6c1.66 0 3.14.69 4.22 1.78l-1.51 1.51c-.63.63-.19 1.71.7 1.71H19c.55 0 1-.45 1-1V6.41c0-.89-1.08-1.34-1.71-.71z"/>',
          del: '<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2zM9 9h6c.55 0 1 .45 1 1v8c0 .55-.45 1-1 1H9c-.55 0-1-.45-1-1v-8c0-.55.45-1 1-1m6.5-5-.71-.71c-.18-.18-.44-.29-.7-.29H9.91c-.26 0-.52.11-.7.29L8.5 4H6c-.55 0-1 .45-1 1s.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1z"/>',
          book: '<path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1m0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5z"/>',
        };
        return (
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          paths[name] +
          '</svg>'
        );
      }

      function getFilteredWorks() {
        var q = store.query.trim();
        return store.works.filter(function (w) {
          var okCat = store.activeCat === 'all' || w.category === store.activeCat;
          if (!okCat) return false;
          if (!q) return true;
          return (w.title + w.source).toLowerCase().indexOf(q.toLowerCase()) !== -1;
        });
      }

      function render() {
        var items = getFilteredWorks();
        var box = els.list;
        var html = '';
        items.forEach(function (w) {
          html +=
            '<article class="work-card" data-id="' +
            w.id +
            '">' +
            '<div class="work-cover">' +
            iconSvg('book') +
            '</div>' +
            '<div class="work-info">' +
            '<div class="work-title-row">' +
            '<span class="work-title" title="' +
            w.title +
            '">' +
            w.title +
            '</span>' +
            '<button class="chip" type="button" data-chip-cat="' +
            w.category +
            '" title="跳转到该分类">' +
            w.category +
            '</button>' +
            '</div>' +
            '<div class="work-meta"><span>来源 ' +
            w.source +
            '</span><span class="sep"></span><span>' +
            w.words +
            ' · ' +
            w.sentences +
            '</span></div>' +
            '</div>' +
            '<div class="work-actions">' +
            '<button class="icon-btn" type="button" data-act="edit" aria-label="编辑作品" title="编辑">' +
            iconSvg('edit') +
            '</button>' +
            '<button class="icon-btn" type="button" data-act="rebuild" aria-label="重建索引" title="重建索引">' +
            iconSvg('refresh') +
            '</button>' +
            '<button class="icon-btn danger" type="button" data-act="delete" aria-label="删除作品" title="删除">' +
            iconSvg('del') +
            '</button>' +
            '</div>' +
            '</article>';
        });
        box.innerHTML = html;

        if (store.pendingDelete) {
          var card = box.querySelector('[data-id="' + store.pendingDelete + '"]');
          if (card) {
            var cf = document.createElement('div');
            cf.className = 'confirm-card';
            cf.innerHTML =
              '<span class="msg">删除后该作品的索引将被移除，此操作不可撤销。</span>' +
              '<div class="row">' +
              '<button class="btn btn-danger btn-small" type="button" data-confirm="yes">确认删除</button>' +
              '<button class="btn btn-ghost-danger btn-small" type="button" data-confirm="no">取消</button>' +
              '</div>';
            card.firstElementChild.appendChild(cf);
          }
        }

        var total = store.works.length;
        var cats = {};
        store.works.forEach(function (w) {
          cats[w.category] = true;
        });
        els.statCount.textContent = total + ' 部作品';
        els.statGroup.textContent = Object.keys(cats).length + ' 个分类';
        document.getElementById('numAll').textContent = total;
        document.getElementById('numXu').textContent = store.works.filter(function (w) {
          return w.category === '玄幻';
        }).length;

        var hint = '';
        if (store.activeCat !== 'all') hint += '分类：' + store.activeCat + '  ';
        if (store.query.trim()) hint += '搜索：“' + store.query.trim() + '”';
        if (hint) {
          els.filterHint.hidden = false;
          els.filterHint.textContent = hint;
        } else {
          els.filterHint.hidden = true;
          els.filterHint.textContent = '';
        }

        els.empty.hidden = items.length > 0;
        box.hidden = items.length === 0;

        // 分类树高亮
        var rows = els.tree.querySelectorAll('.tree-row');
        rows.forEach(function (r) {
          r.classList.toggle('active', r.getAttribute('data-target') === store.activeCat);
        });
      }

      /* 事件绑定 */
      els.search.addEventListener('input', function (e) {
        store.query = e.target.value;
        store.pendingDelete = null;
        render();
      });

      els.tree.addEventListener('click', function (e) {
        var row = e.target.closest('.tree-row');
        if (!row) return;
        var target = row.getAttribute('data-target');
        var node = row.closest('.tree-node');
        if (target === '玄幻') {
          node.classList.toggle('open');
          row.setAttribute('aria-expanded', node.classList.contains('open'));
          return;
        }
        store.activeCat = target;
        store.pendingDelete = null;
        render();
      });

      els.collapseBtn.addEventListener('click', function () {
        store.expanded = !store.expanded;
        var nodes = els.tree.querySelectorAll('.tree-node');
        nodes.forEach(function (n) {
          if (n.getAttribute('data-cat') === '玄幻') {
            n.classList.toggle('open', store.expanded);
            n.querySelector('.tree-row').setAttribute('aria-expanded', store.expanded);
          }
        });
        els.collapseBtn.setAttribute('aria-expanded', store.expanded);
        var svg = els.collapseBtn.querySelector('svg');
        svg.style.transform = store.expanded ? '' : 'rotate(180deg)';
        document.getElementById('collapseLabel').textContent = store.expanded ? '收起全部' : '展开全部';
      });

      els.corpus.addEventListener('change', function (e) {
        showToast('已切换到语料「' + e.target.value + '」');
      });

      els.list.addEventListener('click', function (e) {
        var chip = e.target.closest('[data-chip-cat]');
        var act = e.target.closest('[data-act]');
        var confirmBtn = e.target.closest('[data-confirm]');
        if (chip) {
          store.activeCat = chip.getAttribute('data-chip-cat');
          var node = els.tree.querySelector('.tree-node[data-cat="' + store.activeCat + '"]');
          if (node) node.classList.add('open');
          store.pendingDelete = null;
          render();
          return;
        }
        if (act) {
          var card = e.target.closest('.work-card');
          var id = card.getAttribute('data-id');
          if (act.getAttribute('data-act') === 'delete') {
            store.pendingDelete = id;
            render();
          } else if (act.getAttribute('data-act') === 'edit') {
            showToast('编辑作品功能已就绪（演示环境）');
          } else if (act.getAttribute('data-act') === 'rebuild') {
            showToast('正在重建索引……请稍后查看进度');
          }
          return;
        }
        if (confirmBtn) {
          var cfCard = e.target.closest('.work-card');
          var wid = cfCard.getAttribute('data-id');
          if (confirmBtn.getAttribute('data-confirm') === 'yes') {
            store.works = store.works.filter(function (w) {
              return w.id !== wid;
            });
            store.pendingDelete = null;
            showToast('已删除该作品');
          } else {
            store.pendingDelete = null;
          }
          render();
        }
      });

      document.getElementById('btnMaintain').addEventListener('click', function () {
        showToast('维护面板：支持重建索引与索引巡检（演示环境）');
      });
      document.getElementById('btnImport').addEventListener('click', function () {
        showToast('导入作品：支持 TXT / 网页 / 语料包导入');
      });
      document.getElementById('btnEmptyImport').addEventListener('click', function () {
        showToast('导入作品：支持 TXT / 网页 / 语料包导入');
      });

      render();
    </script>
  </body>
</html>
