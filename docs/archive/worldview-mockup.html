<style>
  .wb-mock {
    font-family: var(--font-sans);
    color: var(--color-text-primary);
    padding: 1rem 0;
  }
  .wb-mock .sec-label {
    font-size: var(--font-text-sm-size);
    font-weight: 500;
    color: var(--color-text-secondary);
    margin: 1.25rem 0 0.5rem;
  }
  .wb-mock .sec-label:first-child {
    margin-top: 0;
  }

  /* 1. 视图切换 pill */
  .wb-tabs {
    display: flex;
    gap: 4px;
  }
  .wb-tab {
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: transparent;
    color: var(--color-text-secondary);
    font-size: var(--font-text-xs-size);
    padding: 3px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .wb-tab.wb-active {
    border-color: var(--color-border-info);
    background: var(--color-background-info);
    color: var(--color-text-inverse);
  }

  /* 2. 列表卡片 */
  .wb-card {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 0.75rem 1rem;
    background: var(--color-background-primary);
  }
  .wb-card-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.5rem;
  }
  .wb-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-text-info);
    flex-shrink: 0;
  }
  .wb-name {
    font-size: var(--font-text-sm-size);
    font-weight: 500;
  }
  .wb-tag {
    font-size: var(--font-text-xs-size);
    color: var(--color-text-tertiary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-sm);
    padding: 1px 6px;
    margin-left: auto;
  }
  .wb-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 0.5rem;
  }
  .wb-chip {
    font-size: var(--font-text-xs-size);
    color: var(--color-text-secondary);
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-sm);
    padding: 2px 7px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .wb-chip .x {
    color: var(--color-text-tertiary);
    cursor: pointer;
  }
  .wb-expand {
    font-size: var(--font-text-xs-size);
    color: var(--color-text-info);
    cursor: pointer;
    padding: 2px 6px;
  }
  .wb-picker {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .wb-input {
    font-size: var(--font-text-sm-size);
    padding: 5px 10px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    outline: none;
  }
  .wb-hint {
    font-size: var(--font-text-xs-size);
    color: var(--color-text-tertiary);
    padding-left: 4px;
  }

  /* 3. 矩阵 */
  .wb-matrix {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    background: var(--color-background-primary);
  }
  .wb-stats {
    font-size: var(--font-text-xs-size);
    color: var(--color-text-secondary);
    padding: 6px 12px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .wb-h-row {
    display: flex;
    padding: 4px 12px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    font-size: var(--font-text-xs-size);
    font-weight: 500;
    color: var(--color-text-tertiary);
  }
  .wb-h-row > span {
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-group {
    font-size: var(--font-text-xs-size);
    font-weight: 500;
    color: var(--color-text-secondary);
    background: var(--color-background-secondary);
    padding: 3px 12px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .wb-d-row {
    display: flex;
    padding: 5px 12px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    font-size: var(--font-text-xs-size);
    color: var(--color-text-primary);
    cursor: pointer;
  }
  .wb-d-row:hover {
    background: var(--color-background-secondary);
  }
  .wb-d-row > span {
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
