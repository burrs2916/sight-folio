# cargo-audit 白名单：仅收录经评估无法通过升级消除的漏洞条目。
# 每条必须附评估理由；升级路径可用后应立即移除并升级。

[advisories]
ignore = [
    # RUSTSEC-2026-0187 — lopdf 0.26 深嵌套 PDF 对象触发栈溢出。
    # 评估：本项目 PDF 导出是「生成器」用法（自建 Document 对象并写出），
    # 从不解析外部/不可信 PDF 文件，攻击面不存在。
    # 升级路径：lopdf 0.26 → 0.42 跨 16 个 minor，自研 PDF 排版引擎 API 全面变更，
    # 收益/风险比不划算；待 lopdf 稳定后单独评估迁移。
    "RUSTSEC-2026-0187",

    # RUSTSEC-2023-0071 — rsa 0.9 Marvin Attack（时序侧信道密钥恢复）。
    # 评估：纯传递依赖（封存域 sqlx-mysql → rsa），主线写作/语料/导出链路
    # 不执行任何 RSA 运算（无 MySQL TLS 握手路径），不可利用。
    # 升级路径：rsa 0.10 需 sqlx 0.9 + 封存域整体升级，随封存域退役自然消失。
    "RUSTSEC-2023-0071",
]
