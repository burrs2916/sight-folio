[package]
name = "sight-folio"
version = "0.1.0"
description = "Sight Folio - Desktop novel & long-form writing editor"
authors = ["you"]
edition = "2021"
default-run = "sight-folio"

[lib]
name = "sight_folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bitflags = "2"

rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
# EPUB 导出：zip 打包（deflate 压缩正文，mimetype 用 STORED）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 语料库导入：epub/docx 的 OPF/container.xml 与 document.xml 轻量 XML 解析（复用 zip 解包）
quick-xml = "0.37"
# 语料库导入：MOBI/AZW3（Kindle）解析。仅能导入无 DRM 的文件；有 DRM 的 AZW/AZW4 本就不支持。
mobi = "0.8"
# DOCX 导出：轻量 zip 打包 word/document.xml，无外部依赖。
# PDF 导出：原生离线生成。lopdf 0.26（default-features=false，规避 0.34 解析器编译缺陷）
# + ttf-parser 解析系统 CJK TTF（全嵌入 FontFile2）+ image 解码正文图片（JPEG/PNG）
# + flate2 压缩图片流。中文文本按字符宽度自研换行布局（genpdf/printpdf 仅按空格断词，
# 对中文无空格正文会截断，故弃用）。
lopdf = { version = "0.26", default-features = false }
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "tls-rustls"] }
redis = { version = "0.27", features = ["tokio-comp"] }
mongodb = "3"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
urlencoding = "2"

encoding_rs = "0.8"
walkdir = "2.4"
notify = "6"

# ─── AST 级源码解析（tree-sitter）───
# 行级正则启发式有精度天花板：字符串里的 "if "、泛型里的 `?`、注释里的 `case ` 都会误加复杂度，
# 且只能算到文件粒度。接入 tree-sitter 后按语法节点精确计数，并可下钻到函数级。
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
ignore = "0.4.32"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"

# ─── 并行计算（rayon）：深度分析阶段的多文件度量/结构提取并行化 ───
rayon = "1"
# ─── 代码工作台集成终端：跨平台 PTY（unix pty / Windows conpty），驱动前端 xterm.js ───
portable-pty = "0.9"
# ─── ACP Host WebSocket 桥（P0.1）：让外部 ACP Agent（claw / OpenClaw）经 ws 驱动本工作台 ───
# 仅启用 handshake（服务端 accept_async 所需），禁用默认 connect/native-tls，避免拉入 openssl/vendored TLS。
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }
futures = "0.3"
tree-sitter-c = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"

[dev-dependencies]
tempfile = "3.27.0"
