<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sf-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B3FA8;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#4A338F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A286F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sf-page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF7EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E7DECB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0A93B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C98F2A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E0A93B;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#E0A93B;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- rounded square base (墨紫) -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sf-base)"/>

  <!-- inspiration glow -->
  <circle cx="256" cy="150" r="82" fill="url(#sf-glow)"/>

  <!-- open book: left page -->
  <path d="M256 266 C 206 244, 150 244, 120 290 L 134 378 C 170 356, 214 362, 256 392 Z" fill="url(#sf-page)"/>
  <!-- open book: right page -->
  <path d="M256 266 C 306 244, 362 244, 392 290 L 378 378 C 342 356, 298 362, 256 392 Z" fill="url(#sf-page)"/>

  <!-- spine (金) -->
  <path d="M256 266 L256 392" fill="none" stroke="url(#sf-gold)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- page text lines -->
  <g stroke="#C9B98F" stroke-width="5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M150 304 L 240 296"/>
    <path d="M150 326 L 240 318"/>
    <path d="M150 348 L 240 342"/>
    <path d="M272 296 L 362 304"/>
    <path d="M272 318 L 362 326"/>
    <path d="M272 342 L 362 348"/>
  </g>

  <!-- inspiration spark (4-point star, 金) -->
  <path d="M256 102 Q256 150 304 150 Q256 150 256 198 Q256 150 208 150 Q256 150 256 102 Z" fill="url(#sf-gold)"/>
  <!-- small sparkles -->
  <path d="M350 116 Q350 130 364 130 Q350 130 350 144 Q350 130 336 130 Q350 130 350 116 Z" fill="url(#sf-gold)"/>
  <path d="M176 190 Q176 201 187 201 Q176 201 176 212 Q176 201 165 201 Q176 201 176 190 Z" fill="url(#sf-gold)"/>
</svg>
