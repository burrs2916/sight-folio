name: CI / Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 编译时注入构建 commit（option_env! 读取），窗口标题显示 build-xxxxxxx，
  # 用户一眼确认运行的是哪次构建的产物。
  BUILD_SHA: ${{ github.sha }}
  # 依赖树巨大（mongodb/sqlx/tree-sitter 全家桶 + 封存域），debug 构建含全量
  # debuginfo 时 target 目录 25GB+，会把 runner 磁盘吃满（os error 28）。
  # 关闭 dev/test profile 的 debuginfo + 增量编译，target 体积降 80%+。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # 本项目前端 bundle 很大（monaco + 主包 5MB+），GitHub runner 上 Node 默认堆（~2GB）会 OOM（exit 134）。
  # 本地 Mac 默认堆更大所以不现；显式抬到 8GB（ubuntu-latest 16GB 内存安全）。workflow 级 env 同时覆盖
  # frontend-check 的 vite build 与 publish-tauri 里 tauri-action 的 beforeBuildCommand（同一个 vite build）。
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 可复现安装：仓库随 package-lock.json 交付（无 pnpm-lock.yaml），故用 npm ci 锁死版本。
      # --legacy-peer-deps：@jiaminghi/data-view-react 声明 peer react@^16，npm 严格 peer 解析
      # 必然 ERESOLVE；该包另由 patches/ 打补丁（postinstall: patch-package）。
      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Vite 依赖预构建缓存（node_modules/.vite/deps）。
      # 这是 dev server 和首次 build 中最慢的一步；缓存命中后构建快 15-30s。
      - name: Cache Vite deps
        uses: actions/cache@v4
        with:
          path: node_modules/.vite/deps
          key: vite-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: vite-deps-

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx vite build

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit tests
        # CI runner（4 核）上 324 个文件并行跑，jsdom 环境把 worker 挤到 RPC 上报超时
        # （"Timeout calling onTaskUpdate"——4898 条测试全过仍 exit 1，纯负载问题）。
        # 关掉文件级并行改单 worker 顺序跑：慢 3~4 倍（约 10 分钟）但彻底消除
        # worker 争抢，换确定性。本地机器核多，`npm test` 不带该参数，速度不变。
        run: npm test -- --no-file-parallelism

  rust-check:
    name: Rust Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 磁盘瘦身：runner 预装 Android SDK(~9GB)/.NET/CodeQL/swapfile(4GB)，
      # 本项目 Rust 依赖树编译产物极大，不清理会 "No space left on device"。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: project-sight-v1

      - name: Install system dependencies
        # fonts-droid-fallback 提供 /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
        # （pdf_export::find_cjk_font 的候选之一）；PDF 导出测试需要系统 CJK TTF，
        # runner 裸装没有会失败（本地 macOS 有中文字体故不现）。
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fonts-droid-fallback

      - name: Cargo fmt
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Cargo clippy
        run: |
          cd src-tauri
          # clippy::unwrap_used + expect_used：让 unwrap()/expect() 在 CI 里报警。
          # 项目当前约 1500+ 处裸 unwrap（以 repository/commands 层为主），
          # 先开警告逐步收敛，暂不 -D（禁止）以免阻塞 PR。
          cargo clippy --all-features -- \
            -W clippy::all \
            -W clippy::unwrap_used \
            -W clippy::expect_used

      - name: Cargo test
        run: |
          cd src-tauri
          cargo test --all-features

  rust-audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit (RustSec DB)
        run: cargo install cargo-audit --locked

      - name: Run vulnerability scan
        run: |
          cd src-tauri
          # 白名单用命令行 --ignore 而非 audit.toml：cargo-audit 对项目级
          # audit.toml 的发现路径在不同版本间不稳定（CI 实测未加载，白名单失效），
          # 命令行参数是确定性生效的唯一方式。逐条豁免理由见 src-tauri/audit.toml。
          # - lopdf（RUSTSEC-2026-0187）：项目只把 lopdf 当 PDF **生成器**（导出写作产物），
          #   从不解析外部/不可信 PDF，触发面是深层嵌套对象解析栈溢出——不可达。
          # - rsa（RUSTSEC-2023-0071）：sqlx-mysql 封存域的传递依赖，主线代码无任何 RSA 运算，
          #   Marvin 时序侧信道不可利用。
          cargo audit \
            --ignore RUSTSEC-2026-0187 \
            --ignore RUSTSEC-2023-0071

  publish-tauri:
    name: Publish ${{ matrix.platform }}
    needs: [frontend-check, rust-check, rust-audit]
    # 只在 push v* 标签时触发 — main 推送不自动编译，完全对齐产品约束。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macOS-x64
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - platform: Linux
            runner: ubuntu-22.04
            args: ''
          - platform: Windows
            runner: windows-latest
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # Linux release 构建同样吃磁盘（依赖树大），先瘦身。
      - name: Free disk space (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -h /

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Strawberry Perl (Windows)
        if: matrix.platform == 'Windows'
        run: choco install strawberryperl -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macOS-x64' && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: project-sight-v1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Project Sight v__VERSION__'
          releaseBody: |
            ## 📦 Project Sight v__VERSION__

            ### 🍎 macOS
            The app uses ad-hoc code signing. On first launch:
            1. Right-click the app and select "Open"
            2. Click "Open" in the security dialog
            3. Or go to **System Settings > Privacy & Security** and click "Open Anyway"

            ### 🪟 Windows
            Run the `.msi` or `.exe` installer directly.

            ### 🐧 Linux
            ```bash
            chmod +x ./*_amd64.AppImage
            ./*_amd64.AppImage
            ```
          releaseDraft: false
          # 固定发正式 Release（不进 Pre-release 折叠区）；此前按 push/branch 条件
          # 判定导致 main 构建产物被标成 pre-release，折叠在 Releases 页底部难找。
          prerelease: false
          args: ${{ matrix.args }}

      # ─── Windows 本地测试版（免安装 portable）───
      # 与商城发布版（MSI/NSIS）并行产出：本地测试不必装安装包，解压双击即可运行。
      # exe 同级目录运行后会生成 debug.log（启动横幅/panic/前端 JS 错误全在这一个文件），
      # 测试报错时把该文件发回来即可定位。前端已打包进 exe，但要求机器预装 WebView2
      # （MSI/NSIS 安装器可以引导安装，裸 exe 不会）。
      - name: Prepare Windows portable package (local test build)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $portableDir = "src-tauri/target/windows-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "uninstall|unins000" } |
            Select-Object -First 1
          if (-not $exe) { Write-Host "✗ main exe not found in $releaseDir"; exit 1 }
          Copy-Item -Path $exe.FullName -Destination $portableDir -Force
          Write-Host "✓ main exe: $($exe.Name)"

          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $portableDir -Force }

          @"
          Sight Folio — Windows 本地测试版（免安装，未签名）

          运行：$($exe.Name)

          依赖：
          - Microsoft Edge WebView2 Runtime（Win10/11 通常已内置；白屏请先安装：
            https://developer.microsoft.com/microsoft-edge/webview2/ ）
          - Visual C++ Redistributable（Win10/11 通常已内置）

          诊断日志（运行后生成，报错时整个发回来即可）：
          - exe 同级目录 debug.log    ← 主诊断通道（启动/panic/前端错误全在这）
          - %LOCALAPPDATA%\com.sight.folio\debug.log   （exe 目录只读时的兜底）
          - %LOCALAPPDATA%\com.sight.folio\logs\app-*.log（业务日志）
          "@ | Set-Content -Path (Join-Path $portableDir "README.txt") -Encoding UTF8

          Compress-Archive -Path (Join-Path $portableDir "*") `
            -DestinationPath "src-tauri/target/windows-portable.zip" -Force
          Write-Host "✓ Created windows-portable.zip"

      - name: Upload standalone EXE (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable ZIP (Windows)
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: src-tauri/target/windows-portable.zip
          if-no-files-found: error
          retention-days: 30

      # 同步上传一份 workflow Artifacts（Actions 运行页的 Artifacts 栏）。
      # tauri-action 只把产物传到 Releases，Actions 页那个栏默认是空的；
      # bundle 目录里只有安装包成品（dmg/exe/msi/AppImage/deb/rpm），
      # 配合 *-target 通配兼容 macOS 的交叉编译目录（target/<target>/release/bundle）。
      - name: Upload workflow artifacts (bundle installers)
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 30
