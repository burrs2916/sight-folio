name: CI / Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 本项目前端 bundle 很大（monaco + 主包 5MB+），GitHub runner 上 Node 默认堆（~2GB）会 OOM（exit 134）。
  # 本地 Mac 默认堆更大所以不现；显式抬到 8GB（ubuntu-latest 16GB 内存安全）。workflow 级 env 同时覆盖
  # frontend-check 的 vite build 与 publish-tauri 里 tauri-action 的 beforeBuildCommand（同一个 vite build）。
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 可复现安装：仓库随 package-lock.json 交付（无 pnpm-lock.yaml），故用 npm ci 锁死版本。
      # --legacy-peer-deps：@jiaminghi/data-view-react 声明 peer react@^16，npm 严格 peer 解析
      # 必然 ERESOLVE；该包另由 patches/ 打补丁（postinstall: patch-package）。
      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx vite build

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit tests
        run: npm test

  rust-check:
    name: Rust Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: project-sight-v1

      - name: Install system dependencies
        # fonts-droid-fallback 提供 /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
        # （pdf_export::find_cjk_font 的候选之一）；PDF 导出测试需要系统 CJK TTF，
        # runner 裸装没有会失败（本地 macOS 有中文字体故不现）。
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fonts-droid-fallback

      - name: Cargo fmt
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Cargo clippy
        run: |
          cd src-tauri
          cargo clippy --all-features -- -W clippy::all

      - name: Cargo test
        run: |
          cd src-tauri
          cargo test --all-features

  publish-tauri:
    name: Publish ${{ matrix.platform }}
    needs: [frontend-check, rust-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macOS-x64
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - platform: Linux
            runner: ubuntu-22.04
            args: ''
          - platform: Windows
            runner: windows-latest
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Strawberry Perl (Windows)
        if: matrix.platform == 'Windows'
        run: choco install strawberryperl -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macOS-x64' && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: project-sight-v1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Project Sight v__VERSION__'
          releaseBody: |
            ## 📦 Project Sight v__VERSION__

            ### 🍎 macOS
            The app uses ad-hoc code signing. On first launch:
            1. Right-click the app and select "Open"
            2. Click "Open" in the security dialog
            3. Or go to **System Settings > Privacy & Security** and click "Open Anyway"

            ### 🪟 Windows
            Run the `.msi` or `.exe` installer directly.

            ### 🐧 Linux
            ```bash
            chmod +x ./*_amd64.AppImage
            ./*_amd64.AppImage
            ```
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: ${{ matrix.args }}
