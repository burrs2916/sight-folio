<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon 内联 data URI：Tauri 2 下 webview 探测 /favicon.svg 会请求
         tauri://localhost 但 asset handler 不响应根级 favicon → devtools 持续报
         "Could not connect to the server (localhost)"。内联后零网络请求。 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234A338F'/%3E%3Cpath d='M50 26 L56 44 L74 50 L56 56 L50 74 L44 56 L26 50 L44 44 Z' fill='%23E0A93B'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sight Folio</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      .moveable-control-box {
        z-index: 99999 !important;
      }
      .moveable-control {
        width: 20px !important;
        height: 20px !important;
        margin-top: -10px !important;
        margin-left: -10px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
